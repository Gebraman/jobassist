<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>JobAssist AI — Recruiter Outreach Mailer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: #090E17; color: #F8FAFC; padding-bottom: 80px; }
    a { color: inherit; text-decoration: none; }

    /* Navbar */
    .navbar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 36px; border-bottom: 1px solid rgba(255,255,255,0.08);
      background: rgba(9, 14, 23, 0.9); backdrop-filter: blur(12px);
      position: sticky; top: 0; z-index: 100;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-logo {
      width: 32px; height: 32px; border-radius: 8px;
      background: linear-gradient(135deg, #10B981, #059669);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 800; color: #022C22;
    }
    .brand-title { font-size: 17px; font-weight: 800; color: #FFF; }
    .nav-links { display: flex; align-items: center; gap: 20px; font-size: 13px; font-weight: 600; color: #94A3B8; }
    .nav-links a:hover { color: #34D399; }

    .container { max-width: 1060px; margin: 30px auto; padding: 0 20px; }

    /* Grid Layout */
    .outreach-grid {
      display: grid; grid-template-columns: 360px 1fr; gap: 24px;
    }
    @media(max-width: 860px) {
      .outreach-grid { grid-template-columns: 1fr; }
    }

    .panel {
      background: #111A29; border: 1px solid #1E293B; border-radius: 14px;
      padding: 22px;
    }
    .panel-title { font-size: 15px; font-weight: 800; color: #FFF; margin-bottom: 14px; display: flex; align-items: center; gap: 6px; }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 11px; font-weight: 700; color: #94A3B8; margin-bottom: 4px; text-transform: uppercase; }
    .form-control {
      width: 100%; background: #1E293B; border: 1px solid #334155; color: #FFF;
      padding: 9px 12px; border-radius: 8px; font-size: 12.5px; font-weight: 600; outline: none;
    }
    .form-control:focus { border-color: #10B981; }

    /* Pitch Preview Box */
    .mail-preview {
      background: #0E1624; border: 1px solid #273549; border-radius: 10px;
      padding: 18px; margin-bottom: 18px;
    }
    .mail-header-row {
      display: flex; gap: 8px; padding-bottom: 8px; border-bottom: 1px solid #1E293B;
      font-size: 12px; color: #94A3B8; margin-bottom: 10px;
    }
    .mail-subject { font-weight: 800; color: #34D399; }
    .mail-body {
      font-size: 13.5px; line-height: 1.65; color: #E2E8F0; white-space: pre-wrap; font-family: 'Inter', sans-serif;
    }

    /* Actions */
    .action-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn-action-primary {
      background: linear-gradient(135deg, #10B981, #059669); color: #022C22;
      border: none; padding: 10px 16px; border-radius: 8px; font-size: 13px; font-weight: 800;
      cursor: pointer; display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
    }
    .btn-action-secondary {
      background: #1E293B; border: 1px solid #334155; color: #CBD5E1;
      padding: 10px 14px; border-radius: 8px; font-size: 12.5px; font-weight: 700;
      cursor: pointer; display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
    }
    .btn-action-secondary:hover { background: #334155; color: #FFF; }
  </style>
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <div class="brand">
      <div class="brand-logo">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      </div>
      <div class="brand-title">JobAssist <span style="font-weight:500; font-size:14px; color:#10B981;">Recruiter Outreach</span></div>
    </div>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/jobs-board">Jobs Board</a>
      <a href="/pipeline">Pipeline CRM</a>
      <a href="/interview-prep">Interview Copilot</a>
      <a href="/pricing">Pricing</a>
    </div>
  </header>

  <div class="container">
    <div class="outreach-grid">
      <!-- Config Panel -->
      <div class="panel">
        <div class="panel-title">
          <span>Outreach Configuration</span>
        </div>

        <div class="form-group">
          <label>Active Candidate</label>
          <select id="sel-cand" class="form-control" onchange="generatePitch()">
            <option value="gebremedhin">Gebremedhin Endeshawe (Founder • Full-Stack Developer)</option>
            <option value="emanuel_ops">Emanuel (Communication & Client Support)</option>
            <option value="emanuel_design">Emanuel (Creative Design & Branding Support)</option>
            <option value="amare_media">Amare (Media & Content Operations Support)</option>
          </select>
        </div>

        <div class="form-group">
          <label>Target Company</label>
          <input type="text" id="inp-company" class="form-control" value="Bask Health" oninput="generatePitch()">
        </div>

        <div class="form-group">
          <label>Target Role</label>
          <input type="text" id="inp-role" class="form-control" value="Senior Back-End Software Engineer" oninput="generatePitch()">
        </div>

        <div class="form-group">
          <label>Recipient Name</label>
          <input type="text" id="inp-recipient" class="form-control" value="Alex Vance" placeholder="e.g. Hiring Manager or Recruiter Name" oninput="generatePitch()">
        </div>

        <div class="form-group">
          <label>Pitch Strategy / Tone</label>
          <select id="sel-tone" class="form-control" onchange="generatePitch()">
            <option value="value_add" selected>Technical Value-Add (Recommended)</option>
            <option value="quick_intro">Quick Warm Intro</option>
            <option value="formal">Formal Executive</option>
          </select>
        </div>
      </div>

      <!-- Preview & Dispatch Panel -->
      <div class="panel">
        <div class="panel-title" style="justify-content: space-between;">
          <span>Cold Outreach Pitch Preview</span>
          <span style="font-size:11px; color:#34D399; font-weight:700;">Ready to Dispatch</span>
        </div>

        <div class="mail-preview">
          <div class="mail-header-row">
            <span>Subject:</span>
            <span id="mail-subj" class="mail-subject">...</span>
          </div>
          <div id="mail-content" class="mail-body">
            Generating pitch...
          </div>
        </div>

        <div class="action-row">
          <a id="btn-gmail" href="#" target="_blank" class="btn-action-primary">
            Compose in Gmail
          </a>
          <a id="btn-outlook" href="#" target="_blank" class="btn-action-secondary">
            Compose in Outlook
          </a>
          <button id="btn-copy" class="btn-action-secondary" onclick="copyOutreach()">
            Copy to Clipboard
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const candidates = {
      gebremedhin: { name: 'Gebremedhin Endeshawe (Gman)', headline: 'Virtual Assistant & Data Entry Lead', yearsBE: '3', phone: '0948232719', linkedin: 'https://www.linkedin.com/in/nexa-digitalteamhq-354a1840b', email: 'nexadigitalteamhq@gmail.com' },
      emanuel_ops: { name: 'Emanuel', headline: 'Data Entry & Spreadsheet Specialist', yearsBE: '3', phone: '0948232719', linkedin: 'https://www.linkedin.com/in/nexa-digitalteamhq-354a1840b', email: 'nexadigitalteamhq@gmail.com' },
      emanuel_design: { name: 'Emanuel 2', headline: 'Virtual Assistant (Canva & Media Design)', yearsBE: '3', phone: '0948232719', linkedin: 'https://www.linkedin.com/in/nexa-digitalteamhq-354a1840b', email: 'nexadigitalteamhq@gmail.com' },
      amare_media: { name: 'Amare', headline: 'Customer Support & Live Chat Representative', yearsBE: '3', phone: '0948232719', linkedin: 'https://www.linkedin.com/in/nexa-digitalteamhq-354a1840b', email: 'nexadigitalteamhq@gmail.com' }
    };

    let currentOutreach = null;

    async function generatePitch() {
      const candKey = document.getElementById('sel-cand').value;
      const candidate = candidates[candKey];
      const company = document.getElementById('inp-company').value.trim();
      const jobTitle = document.getElementById('inp-role').value.trim();
      const recipientName = document.getElementById('inp-recipient').value.trim();
      const tone = document.getElementById('sel-tone').value;

      try {
        const res = await fetch('/api/ai/outreach-generator', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({
            recipientName,
            recipientRole: 'Technical Recruiter',
            company,
            jobTitle,
            candidate,
            tone
          })
        });
        const data = await res.json();
        currentOutreach = data.outreach;
        renderOutreachUI(currentOutreach);
      } catch(err) {
        console.error(err);
      }
    }

    function renderOutreachUI(outreach) {
      if (!outreach) return;
      document.getElementById('mail-subj').textContent = outreach.subject;
      document.getElementById('mail-content').textContent = outreach.body;
      document.getElementById('btn-gmail').href = outreach.gmailUrl;
      document.getElementById('btn-outlook').href = outreach.outlookUrl;
    }

    function showToast(msg) {
      let toast = document.getElementById('outreach-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'outreach-toast';
        toast.style.cssText = 'position:fixed;bottom:24px;right:24px;background:#10B981;color:#022C22;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:700;box-shadow:0 8px 24px rgba(16,185,129,0.4);z-index:99999;transition:all 0.3s;';
        document.body.appendChild(toast);
      }
      toast.textContent = msg;
      toast.style.opacity = '1';
      setTimeout(() => { toast.style.opacity = '0'; }, 3000);
    }

    function copyOutreach() {
      if (!currentOutreach) return;
      const fullText = `Subject: ${currentOutreach.subject}\n\n${currentOutreach.body}`;
      navigator.clipboard.writeText(fullText);
      showToast('Copied outreach email to clipboard!');
    }

    generatePitch();
  </script>
</body>
</html>
