<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Administrator Authentication — JobAssist</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: #0B1120;
      color: #F8FAFC;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-card {
      background: #0F172A;
      border: 1px solid #1E293B;
      border-radius: 14px;
      max-width: 440px;
      width: 100%;
      padding: 34px 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    .brand-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .brand-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #007aff, #38bdf8);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 16px rgba(0, 122, 255, 0.4);
    }
    .brand-title {
      font-size: 19px;
      font-weight: 800;
      color: #FFF;
      letter-spacing: -0.5px;
    }
    .brand-sub {
      font-size: 11.5px;
      color: #94A3B8;
    }
    .badge-lock {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(14, 165, 233, 0.12);
      border: 1px solid rgba(14, 165, 233, 0.3);
      color: #38BDF8;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 18px;
    }
    h1 {
      font-size: 21px;
      font-weight: 800;
      margin-bottom: 6px;
      color: #FFFFFF;
    }
    .auth-desc {
      font-size: 13px;
      color: #94A3B8;
      line-height: 1.5;
      margin-bottom: 22px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #CBD5E1;
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      background: #1E293B;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 11px 14px;
      color: #FFFFFF;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus {
      border-color: #38BDF8;
    }
    .btn-submit {
      width: 100%;
      background: #007aff;
      color: #FFFFFF;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13.5px;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }
    .btn-submit:hover {
      background: #0066d6;
    }
    .feedback-box {
      display: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12px;
      margin-bottom: 16px;
      line-height: 1.4;
    }
    .feedback-error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #EF4444;
      color: #FCA5A5;
    }
    .feedback-success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid #10B981;
      color: #6EE7B7;
    }
    .toggle-row {
      margin-top: 20px;
      text-align: center;
      font-size: 12px;
      color: #94A3B8;
      border-top: 1px solid #1E293B;
      padding-top: 16px;
    }
    .toggle-row a {
      color: #38BDF8;
      text-decoration: none;
      font-weight: 700;
      cursor: pointer;
    }
    .back-home {
      display: block;
      text-align: center;
      margin-top: 14px;
      font-size: 12px;
      color: #64748B;
      text-decoration: none;
    }
    .back-home:hover {
      color: #94A3B8;
    }
  </style>
</head>
<body>

<div class="auth-card">
  <div class="brand-row">
    <div class="brand-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
    </div>
    <div>
      <div class="brand-title">JobAssist</div>
      <div class="brand-sub">Platform Security</div>
    </div>
  </div>

  <div class="badge-lock">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    RESTRICTED ACCESS
  </div>

  <h1 id="view-title">Admin Sign In</h1>
  <p id="view-desc" class="auth-desc">Sign in with your configured administrator email to access the control center.</p>

  <div id="feedback" class="feedback-box"></div>

  <form id="auth-form" onsubmit="handleAuthSubmit(event)">
    <div class="form-group" id="group-name" style="display: none;">
      <label for="input-name">Admin Name</label>
      <input type="text" id="input-name" placeholder="Administrator Name" autocomplete="name">
    </div>

    <div class="form-group">
      <label for="input-email">Administrator Email</label>
      <input type="email" id="input-email" required placeholder="admin@example.com" autocomplete="email">
    </div>

    <div class="form-group">
      <label for="input-password">Password</label>
      <input type="password" id="input-password" required placeholder="Enter your password" autocomplete="current-password">
    </div>

    <button type="submit" id="btn-submit" class="btn-submit">Sign In to Dashboard</button>
  </form>

  <div class="toggle-row">
    <span id="toggle-prompt">First time setting up your admin account?</span>
    <a id="toggle-link" onclick="toggleAuthMode()">Register Password</a>
  </div>

  <a href="/" class="back-home">&larr; Return to Candidate Platform</a>
</div>

<script>
  let isRegisterMode = false;

  function toggleAuthMode() {
    isRegisterMode = !isRegisterMode;
    const title = document.getElementById('view-title');
    const desc = document.getElementById('view-desc');
    const btn = document.getElementById('btn-submit');
    const nameGroup = document.getElementById('group-name');
    const togglePrompt = document.getElementById('toggle-prompt');
    const toggleLink = document.getElementById('toggle-link');
    const feedback = document.getElementById('feedback');
    feedback.style.display = 'none';

    if (isRegisterMode) {
      title.textContent = 'Admin Setup';
      desc.textContent = 'Set your administrator password. Your email must match the ADMIN_EMAIL environment variable.';
      btn.textContent = 'Initialize Admin Account';
      nameGroup.style.display = 'block';
      togglePrompt.textContent = 'Already configured your password?';
      toggleLink.textContent = 'Sign In';
    } else {
      title.textContent = 'Admin Sign In';
      desc.textContent = 'Sign in with your configured administrator email to access the control center.';
      btn.textContent = 'Sign In to Dashboard';
      nameGroup.style.display = 'none';
      togglePrompt.textContent = 'First time setting up your admin account?';
      toggleLink.textContent = 'Register Password';
    }
  }

  async function handleAuthSubmit(e) {
    e.preventDefault();
    const email = document.getElementById('input-email').value.trim();
    const password = document.getElementById('input-password').value;
    const name = document.getElementById('input-name').value.trim();
    const feedback = document.getElementById('feedback');
    const btn = document.getElementById('btn-submit');

    feedback.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Verifying...';

    const endpoint = isRegisterMode ? '/api/auth/register' : '/api/auth/login';
    const payload = isRegisterMode ? { email, password, name } : { email, password };

    try {
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();

      if (!res.ok || !data.success) {
        feedback.className = 'feedback-box feedback-error';
        feedback.textContent = data.error || 'Authentication failed. Please check your credentials.';
        feedback.style.display = 'block';
        btn.disabled = false;
        btn.textContent = isRegisterMode ? 'Initialize Admin Account' : 'Sign In to Dashboard';
        return;
      }

      // Check if user is actually the administrator
      if (!data.user.isAdmin) {
        feedback.className = 'feedback-box feedback-error';
        feedback.textContent = 'Authentication succeeded, but this email address does not have administrator privileges.';
        feedback.style.display = 'block';
        btn.disabled = false;
        btn.textContent = isRegisterMode ? 'Initialize Admin Account' : 'Sign In to Dashboard';
        return;
      }

      // Admin verified!
      feedback.className = 'feedback-box feedback-success';
      feedback.textContent = 'Administrator verified. Redirecting to dashboard...';
      feedback.style.display = 'block';

      // Store in storage for convenience
      if (data.token) {
        localStorage.setItem('ja_admin_token', data.token);
        localStorage.setItem('ja_admin_email', data.user.email);
      }

      setTimeout(() => {
        window.location.href = '/admin';
      }, 500);

    } catch (err) {
      feedback.className = 'feedback-box feedback-error';
      feedback.textContent = 'Network error connecting to server: ' + err.message;
      feedback.style.display = 'block';
      btn.disabled = false;
      btn.textContent = isRegisterMode ? 'Initialize Admin Account' : 'Sign In to Dashboard';
    }
  }
</script>

</body>
</html>
