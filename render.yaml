services:
  - type: web
    name: jobassist-platform
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: TELEBIRR_RECEIVER_PHONE
        value: "0948232717"
      - key: CBE_ACCOUNT_NUMBER
        value: "1000542193275"
      - key: BINANCE_PAY_ID
        value: "1032674236"
      - key: ADMIN_EMAIL
        value: "" # Enter your administrator email in the Render dashboard
